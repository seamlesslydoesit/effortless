<title>Calico on the Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&family=Patrick+Hand&display=swap">
<style>
/* Layout: a storybook-page stage with hand-lettered step tags, controls beneath, then the seven moves as colored cards */
:root {
  --paper: #fff7ea;
  --card: #ffffff;
  --ink: #4a3226;
  --muted: #7d6656;
  --rose: #ef7d95;
  --leaf: #5fae62;
  --sun: #ffc94a;
  --edge: #f1dfc8;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Patrick Hand", "Comic Sans MS", cursive;
  --s1: #f4846c; --s2: #f6a243; --s3: #f2c53d; --s4: #7cc576; --s5: #4fc0b0; --s6: #6aaee8; --s7: #b38ce0;
}
html { background: var(--paper); }
body {
  background: var(--paper);
  background-image: radial-gradient(circle at 1px 1px, rgba(74, 50, 38, .07) 1px, transparent 0);
  background-size: 14px 14px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  padding-inline: 16px;
}
main {
  max-width: 1000px;
  margin: 0 auto;
  padding-block: 28px 48px;
  display: grid;
  gap: 20px;
}
header { display: grid; gap: 6px; }
h1 {
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(2rem, 5.5vw, 3.2rem);
  line-height: 1.08;
  margin: 0;
  text-wrap: balance;
}
h1 .o { color: var(--s2); }
h1 .b { color: var(--ink); }
h1 .w { color: var(--rose); }
header p { margin: 0; color: var(--muted); max-width: 62ch; font-size: 17px; }
.stage {
  border-radius: 22px;
  overflow: hidden;
  border: 3px solid var(--ink);
  background: #bfe7f7;
  box-shadow: 6px 6px 0 var(--edge);
  max-width: 100%;
}
canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button {
  font: 600 16px/1 var(--display);
  color: var(--ink);
  background: var(--sun);
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  padding: 10px 20px;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink);
  transition: transform .1s, box-shadow .1s;
}
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
button.ghost { background: var(--card); }
button.ghost[aria-pressed="true"] { background: var(--s6); color: #fff; }
button:focus-visible, .steps button:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
.fact { margin-left: auto; color: var(--muted); font-family: var(--hand); font-size: 20px; }
.steps {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap: 12px;
}
.steps li { min-width: 0; display: flex; }
.steps button {
  all: unset;
  box-sizing: border-box;
  width: 100%;
  cursor: pointer;
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 12px;
  align-items: start;
  padding: 12px 14px;
  border-radius: 16px;
  background: var(--card);
  border: 2.5px solid var(--edge);
  transition: border-color .2s, transform .2s;
}
.steps button:hover { border-color: var(--c); }
.steps .num {
  grid-row: span 2;
  width: 34px; height: 34px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--c);
  color: #fff;
  font: 600 18px/1 var(--display);
  border: 2.5px solid var(--ink);
}
.steps b { font-family: var(--display); font-weight: 600; font-size: 17px; }
.steps span.txt { color: var(--muted); font-size: 14.5px; line-height: 1.45; }
.steps li.on button { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, white); transform: translateY(-2px); }
@media (max-width: 560px) { .fact { margin-left: 0; width: 100%; } }
</style>

<main>
  <header>
    <h1>How a <span class="o">cal</span><span class="b">i</span><span class="w">co</span> hops onto a high wall</h1>
    <p>Follow her on a sunny garden afternoon as she measures the wall, coils, leaps, catches the edge and scrambles over. Tap any step to see that moment.</p>
  </header>

  <div class="stage">
    <canvas id="scene" width="960" height="540" aria-label="Illustrated animation of a calico cat in a sunny flower garden. She walks up to a brick wall, crouches, leaps, grabs the top edge, scrambles up, pulls herself over and sits on top. Each step is labelled."></canvas>
  </div>

  <div class="controls">
    <button id="play" type="button">Pause</button>
    <button id="replay" class="ghost" type="button">Start over</button>
    <button id="slow" class="ghost" type="button" aria-pressed="false">Slow motion</button>
    <span class="fact">A cat can leap about five times her own height!</span>
  </div>

  <ol class="steps" id="steps">
    <li style="--c: var(--s1)"><button type="button" data-step="0"><span class="num">1</span><b>Walk up</b><span class="txt">She stops a couple of body lengths away and looks up at the top.</span></button></li>
    <li style="--c: var(--s2)"><button type="button" data-step="1"><span class="num">2</span><b>Crouch and wiggle</b><span class="txt">Back legs fold like springs. The little bottom wiggle sets her feet.</span></button></li>
    <li style="--c: var(--s3)"><button type="button" data-step="2"><span class="num">3</span><b>Leap</b><span class="txt">Back legs push off hard. She aims so the top of the jump meets the edge.</span></button></li>
    <li style="--c: var(--s4)"><button type="button" data-step="3"><span class="num">4</span><b>Grab the edge</b><span class="txt">Front paws hook over the top, claws out.</span></button></li>
    <li style="--c: var(--s5)"><button type="button" data-step="4"><span class="num">5</span><b>Scramble</b><span class="txt">Back legs pedal against the bricks to push her higher.</span></button></li>
    <li style="--c: var(--s6)"><button type="button" data-step="5"><span class="num">6</span><b>Pull over</b><span class="txt">Elbows bend, and she hauls herself up onto the top.</span></button></li>
    <li style="--c: var(--s7)"><button type="button" data-step="6"><span class="num">7</span><b>Settle in</b><span class="txt">A few proud steps, then she sits by the flowers and wraps her tail round her paws.</span></button></li>
  </ol>
</main>

<script>
(() => {
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  const W = 960, H = 540;
  const GROUND = 452;       // garden level
  const WALL_X = 560;       // front face of the wall
  const WALL_TOP = 172;     // top of the coping stones

  const INK = '#4a3226';
  const C = {
    fur: '#fffaf2', shade: '#e6d9c8', orange: '#f08a3c', black: '#3b2f2c',
    ink: INK, pink: '#f4a0a8', eye: '#8fcf4f', blush: 'rgba(244,140,160,.55)'
  };
  const STEP_COLORS = ['#f4846c', '#f6a243', '#f2c53d', '#7cc576', '#4fc0b0', '#6aaee8', '#b38ce0'];
  const STEP_NAMES = ['Walk up', 'Crouch & wiggle', 'Leap!', 'Grab the edge', 'Scramble', 'Pull over', 'Settle in'];

  // ---------- canvas sizing ----------
  function resize() {
    const w = cv.getBoundingClientRect().width || W;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(w * 9 / 16 * dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- helpers ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  const mix = (A, B, u) => { const o = {}; for (const k in A) o[k] = lerp(A[k], B[k], u); return o; };
  function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }

  // ---------- cat poses ----------
  // rot: body tilt (negative = nose up). fa/fk, ba/bk: front/back leg angle and joint bend.
  // hd: head tilt. ta/tc: tail angle and curl. sw*/ph: walking swing.
  const base = { x: 0, y: 0, rot: 0, st: 1, fa: 0, fk: 0, ba: 0, bk: .45, hd: 0, ta: .5, tc: .6, swF: 0, swB: 0, ph: 0 };
  const P_STAND  = { ...base };
  const P_CROUCH = { ...base, rot: .07, st: .95, fa: -.5, fk: -.6, ba: .2, bk: 1.0, hd: -.3, ta: .05, tc: .15 };
  const P_LEAP   = { ...base, rot: -.7, st: 1.2, fa: 1.4, fk: .1, ba: -1.3, bk: .05, hd: .35, ta: -.25, tc: .1 };
  const P_HANG   = { ...base, rot: -1.25, st: 1.1, fa: 1.25, fk: .65, ba: .1, bk: .6, hd: .95, ta: .9, tc: -1.0 };
  const P_CLIMB  = { ...base, rot: -.95, st: 1.05, fa: 0, fk: -.6, ba: -.2, bk: .7, hd: .7, ta: .6, tc: -.6 };
  const P_SIT    = { ...base, rot: -.5, st: .9, fa: -.5, fk: 0, ba: 1.0, bk: .8, hd: .4, ta: -.3, tc: -2.4 };

  function legPts(ax, ay, a, k, l1, l2) {
    const kx = ax + l1 * Math.sin(a + k), ky = ay + l1 * Math.cos(a + k);
    return [ax, ay, kx, ky, kx + l2 * Math.sin(a - k), ky + l2 * Math.cos(a - k)];
  }
  function geom(p) {
    const L = 45 * p.st, s = Math.sin(p.ph), c = Math.cos(p.ph);
    const liftF = p.swF / .45, liftB = p.swB / .45;
    return {
      L,
      fN: legPts(L * .6, 8, p.fa + p.swF * s, p.fk - .7 * liftF * Math.max(0, c), 18, 18),
      fF: legPts(L * .6 - 7, 8, p.fa - p.swF * s, p.fk - .7 * liftF * Math.max(0, -c), 18, 18),
      bN: legPts(-L * .6, 6, p.ba - p.swB * s, p.bk + .5 * liftB * Math.max(0, -c), 20, 20),
      bF: legPts(-L * .6 + 7, 6, p.ba + p.swB * s, p.bk + .5 * liftB * Math.max(0, c), 20, 20)
    };
  }
  function toWorld(p, lx, ly) {
    const c = Math.cos(p.rot), s = Math.sin(p.rot);
    return [p.x + lx * c - ly * s, p.y + lx * s + ly * c];
  }
  // Put the lowest paw (or the sitting haunch) on the given surface.
  function solve(p, level) {
    p.y = 0;
    const g = geom(p);
    let m = -1e9;
    for (const l of [g.fN, g.fF, g.bN, g.bF]) m = Math.max(m, toWorld(p, l[4], l[5])[1] + 4);
    m = Math.max(m, toWorld(p, -g.L * .56, 17)[1]);
    p.y = level - m;
    return p;
  }
  // Place the cat so her near front paw lands on a point.
  function placeByPaw(p, tx, ty) {
    p.x = 0; p.y = 0;
    const g = geom(p);
    const w = toWorld(p, g.fN[4], g.fN[5]);
    p.x = tx - w[0]; p.y = ty - 4 - w[1];
    return p;
  }

  const X_CROUCH = 392, X_TOP = 614, X_SIT = 690;
  const crouchP = solve({ ...P_CROUCH, x: X_CROUCH }, GROUND);
  const hangP   = placeByPaw({ ...P_HANG }, 572, WALL_TOP);
  const climbP  = placeByPaw({ ...P_CLIMB }, 606, WALL_TOP);
  const topP    = solve({ ...P_STAND, x: X_TOP }, WALL_TOP);

  // ---------- timeline ----------
  const T = { walk: 2.4, crouch: 3.6, leap: 4.25, grab: 4.6, scramble: 5.45, pull: 6.15, stroll: 7.05, sit: 7.75, end: 11.5 };
  const STEP_STARTS = [0, T.walk, T.crouch, T.leap, T.grab, T.scramble, T.pull];

  function poseAt(t) {
    let p, u;
    if (t < T.walk) {
      u = t / T.walk;
      const x = lerp(-110, X_CROUCH, u * (1.25 - .25 * u));
      const amp = .45 * clamp((1 - u) * 5, 0, 1);
      p = solve({ ...P_STAND, x, swF: amp, swB: amp, ph: x / 11 }, GROUND);
    } else if (t < T.crouch) {
      u = (t - T.walk) / (T.crouch - T.walk);
      p = mix({ ...P_STAND, x: X_CROUCH }, crouchP, ease(clamp(u / .45, 0, 1)));
      if (u > .5) {
        const w = Math.sin((u - .5) / .5 * Math.PI);
        p.rot += .035 * Math.sin(t * 34) * w;
        p.tc += .5 * Math.sin(t * 14) * w;
      }
      solve(p, GROUND);
    } else if (t < T.leap) {
      u = (t - T.crouch) / (T.leap - T.crouch);
      const L1 = { ...P_LEAP, x: 0, y: 0 };
      p = u < .3 ? mix(crouchP, L1, ease(u / .3)) : mix(L1, hangP, ease((u - .3) / .7));
      // steady forward speed, rising fast then slowing: she arrives at the top of her arc
      p.x = lerp(crouchP.x, hangP.x, u);
      p.y = crouchP.y + (hangP.y - crouchP.y) * (1 - (1 - u) * (1 - u));
    } else if (t < T.grab) {
      u = (t - T.leap) / (T.grab - T.leap);
      p = { ...hangP };
      p.y += 5 * Math.sin(u * Math.PI);
    } else if (t < T.scramble) {
      u = (t - T.grab) / (T.scramble - T.grab);
      p = mix(hangP, climbP, ease(u));
      p.swB = .85 * Math.sin(u * Math.PI);
      p.ph = t * 24;
    } else if (t < T.pull) {
      u = (t - T.scramble) / (T.pull - T.scramble);
      p = mix(climbP, topP, ease(u));
      p.y -= 12 * Math.sin(u * Math.PI);
    } else if (t < T.stroll) {
      u = (t - T.pull) / (T.stroll - T.pull);
      const x = lerp(X_TOP, X_SIT, u * (1.25 - .25 * u));
      const amp = .4 * clamp(u * 6, 0, 1) * clamp((1 - u) * 5, 0, 1);
      p = solve({ ...P_STAND, x, swF: amp, swB: amp, ph: (x - X_TOP) / 11 }, WALL_TOP);
    } else if (t < T.sit) {
      u = (t - T.stroll) / (T.sit - T.stroll);
      p = solve(mix({ ...P_STAND, x: X_SIT }, { ...P_SIT, x: X_SIT }, ease(u)), WALL_TOP);
    } else {
      const r = t - T.sit;
      p = { ...P_SIT, x: X_SIT };
      p.tc += .22 * Math.sin(r * 2.2);
      p.hd += .1 * Math.sin(r * .9);
      solve(p, WALL_TOP);
    }
    return p;
  }

  function stepAt(t) {
    let s = 0;
    for (let i = 0; i < STEP_STARTS.length; i++) if (t >= STEP_STARTS[i]) s = i;
    return s;
  }

  // ---------- scenery data ----------
  const rand = rng(11);
  const clouds = [[120, 70, 1], [420, 50, .8], [700, 105, .7], [980, 60, .9]];
  const brickTint = Array.from({ length: 400 }, () => rand());
  const tufts = Array.from({ length: 60 }, () => [rand() * (WALL_X - 10), GROUND + 6 + rand() * 70]);
  const PETALS = ['#ef7d95', '#f6a243', '#f2c53d', '#b38ce0', '#ffffff', '#f4846c', '#6aaee8'];
  function makeFlowers(n, y0, y1, xMax, hMin, hMax) {
    return Array.from({ length: n }, () => ({
      x: rand() * xMax, y: y0 + rand() * (y1 - y0), h: hMin + rand() * (hMax - hMin),
      col: PETALS[Math.floor(rand() * PETALS.length)], kind: Math.floor(rand() * 3), ph: rand() * 6, s: .8 + rand() * .5
    })).sort((a, b) => a.y - b.y);
  }
  const backFlowers = makeFlowers(16, GROUND - 2, GROUND + 4, WALL_X - 20, 18, 34);
  const wallFlowers = makeFlowers(14, GROUND - 2, GROUND + 4, W - WALL_X, 22, 40).map(f => ({ ...f, x: f.x + WALL_X + 6 }));
  const frontFlowers = makeFlowers(26, 500, 540, W, 26, 46);
  const roses = [[770, 230], [792, 262], [760, 300], [905, 210], [930, 248], [895, 330], [915, 372]];
  const butterflies = [
    { cx: 250, cy: 330, rx: 120, ry: 50, sp: .45, col: '#f2c53d', ph: 0 },
    { cx: 760, cy: 120, rx: 90, ry: 40, sp: .6, col: '#ef7d95', ph: 2 },
    { cx: 130, cy: 220, rx: 70, ry: 60, sp: .5, col: '#6aaee8', ph: 4 }
  ];

  // paper grain overlay
  const grain = document.createElement('canvas');
  grain.width = grain.height = 160;
  (() => {
    const g = grain.getContext('2d'), r = rng(3);
    for (let i = 0; i < 1400; i++) {
      g.fillStyle = r() < .5 ? 'rgba(74,50,38,.06)' : 'rgba(255,255,255,.08)';
      g.fillRect(r() * 160, r() * 160, 1.4, 1.4);
    }
  })();
  const grainPattern = ctx.createPattern(grain, 'repeat');

  // ---------- scenery drawing ----------
  function cloud(x, y, s) {
    ctx.save();
    ctx.translate(x, y); ctx.scale(s, s);
    const blobs = [[0, 0, 26], [28, -14, 32], [62, -4, 26], [86, 6, 18], [-22, 8, 18]];
    ctx.fillStyle = '#dcebf3';
    for (const [bx, by, r] of blobs) { ctx.beginPath(); ctx.arc(bx + 3, by + 6, r, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#ffffff';
    for (const [bx, by, r] of blobs) { ctx.beginPath(); ctx.arc(bx, by, r, 0, 7); ctx.fill(); }
    ctx.fillRect(-22, 8, 108, 18);
    ctx.restore();
  }

  function flower(f, clock, scale = 1) {
    const sway = Math.sin(clock * 1.6 + f.ph) * .08;
    const h = f.h * scale, s = f.s * scale;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(sway);
    ctx.strokeStyle = '#4f9a4f'; ctx.lineWidth = 2.5 * scale; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(4 * scale, -h / 2, 0, -h); ctx.stroke();
    ctx.fillStyle = '#6fbf63';
    ctx.beginPath(); ctx.ellipse(5 * scale, -h * .4, 7 * scale, 3 * scale, -.6, 0, 7); ctx.fill();
    ctx.translate(0, -h);
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = INK;
    if (f.kind === 0) { // daisy-style
      ctx.fillStyle = f.col;
      for (let i = 0; i < 6; i++) {
        ctx.save(); ctx.rotate(i * Math.PI / 3);
        ctx.beginPath(); ctx.ellipse(0, -7 * s, 3.6 * s, 6.5 * s, 0, 0, 7); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = '#f2c53d';
      ctx.beginPath(); ctx.arc(0, 0, 4.2 * s, 0, 7); ctx.fill(); ctx.stroke();
    } else if (f.kind === 1) { // tulip
      ctx.fillStyle = f.col;
      ctx.beginPath();
      ctx.moveTo(-7 * s, -2 * s);
      ctx.lineTo(-7 * s, -12 * s); ctx.lineTo(-3.5 * s, -8 * s); ctx.lineTo(0, -13 * s);
      ctx.lineTo(3.5 * s, -8 * s); ctx.lineTo(7 * s, -12 * s); ctx.lineTo(7 * s, -2 * s);
      ctx.quadraticCurveTo(0, 6 * s, -7 * s, -2 * s);
      ctx.fill(); ctx.stroke();
    } else { // round bloom
      ctx.fillStyle = f.col;
      for (let i = 0; i < 5; i++) {
        const a = i * Math.PI * 2 / 5;
        ctx.beginPath(); ctx.arc(Math.cos(a) * 5 * s, Math.sin(a) * 5 * s, 5 * s, 0, 7); ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = '#fff3c4';
      ctx.beginPath(); ctx.arc(0, 0, 3.2 * s, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function butterfly(b, clock) {
    const a = clock * b.sp + b.ph;
    const x = b.cx + Math.sin(a) * b.rx, y = b.cy + Math.sin(a * 2.1) * b.ry;
    const flap = .35 + .65 * Math.abs(Math.sin(clock * 12 + b.ph));
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.cos(a) * .25);
    ctx.fillStyle = b.col; ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
    for (const side of [-1, 1]) {
      ctx.save(); ctx.scale(side * flap, 1);
      ctx.beginPath(); ctx.ellipse(6, -5, 7, 6, -.4, 0, 7); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(5, 4, 5, 4, .4, 0, 7); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.ellipse(0, 0, 1.6, 7, 0, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawScene(clock) {
    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, '#8fd3f4');
    sky.addColorStop(1, '#e4f6fc');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, GROUND);

    // sun
    ctx.save();
    ctx.translate(892, 70);
    ctx.rotate(clock * .15);
    ctx.fillStyle = '#ffe08a';
    for (let i = 0; i < 12; i++) {
      ctx.rotate(Math.PI / 6);
      ctx.beginPath(); ctx.moveTo(-6, -42); ctx.lineTo(0, -58); ctx.lineTo(6, -42); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = '#ffc94a'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(892, 70, 34, 0, 7); ctx.fill(); ctx.stroke();

    // drifting clouds
    for (const [x, y, s] of clouds) {
      const cx = ((x + clock * 12 * s) % (W + 260)) - 130;
      cloud(cx, y, s);
    }

    // rolling hills
    ctx.fillStyle = '#b7e39a';
    ctx.beginPath(); ctx.moveTo(0, GROUND);
    ctx.bezierCurveTo(120, 300, 300, 330, 420, 360);
    ctx.bezierCurveTo(560, 400, 700, 300, W, 340);
    ctx.lineTo(W, GROUND); ctx.fill();
    ctx.fillStyle = '#9ad47f';
    ctx.beginPath(); ctx.moveTo(0, 380);
    ctx.bezierCurveTo(160, 340, 260, 420, 420, 400);
    ctx.bezierCurveTo(560, 385, 640, 420, W, 395);
    ctx.lineTo(W, GROUND); ctx.lineTo(0, GROUND); ctx.fill();
    // lollipop trees
    for (const [x, y, r, col] of [[90, 352, 26, '#6fbf63'], [150, 366, 18, '#86cc6c'], [330, 380, 22, '#6fbf63']]) {
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
      ctx.fillStyle = '#a8794f';
      ctx.fillRect(x - 3, y, 6, r + 12); ctx.strokeRect(x - 3, y, 6, r + 12);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(x, y - 4, r, 0, 7); ctx.fill(); ctx.stroke();
    }

    // lawn
    ctx.fillStyle = '#8fd46b';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#7cc45b';
    ctx.fillRect(0, GROUND, W, 5);
    ctx.strokeStyle = '#6bb04f'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (const [x, y] of tufts) {
      ctx.beginPath();
      ctx.moveTo(x - 4, y); ctx.lineTo(x - 6, y - 7);
      ctx.moveTo(x, y); ctx.lineTo(x, y - 9);
      ctx.moveTo(x + 4, y); ctx.lineTo(x + 6, y - 7);
      ctx.stroke();
    }

    // wall
    const BR_H = 22, BR_W = 54, top = WALL_TOP + 16;
    ctx.fillStyle = '#f6dcc4';
    ctx.fillRect(WALL_X, top, W - WALL_X, GROUND - top);
    let n = 0;
    for (let y = top, row = 0; y < GROUND; y += BR_H, row++) {
      for (let x = WALL_X - (row % 2 ? BR_W / 2 : 0); x < W; x += BR_W) {
        const tint = brickTint[n++ % brickTint.length];
        const x0 = Math.max(WALL_X + 3, x + 3), x1 = x + BR_W - 3;
        if (x1 <= x0) continue;
        ctx.fillStyle = `hsl(${12 + tint * 10}, ${62 + tint * 10}%, ${62 + tint * 8}%)`;
        rrect(x0, y + 3, x1 - x0, Math.min(BR_H - 6, GROUND - y - 4), 5);
        ctx.fill();
      }
    }
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.strokeRect(WALL_X, top, W - WALL_X + 4, GROUND - top);
    // coping
    ctx.fillStyle = '#fbeedb';
    rrect(WALL_X - 10, WALL_TOP, W - WALL_X + 20, 17, 6);
    ctx.fill(); ctx.stroke();

    // climbing vines with roses
    ctx.strokeStyle = '#4f9a4f'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(775, GROUND); ctx.bezierCurveTo(740, 380, 800, 300, 765, 190);
    ctx.moveTo(910, GROUND); ctx.bezierCurveTo(950, 380, 880, 280, 915, 190);
    ctx.stroke();
    ctx.fillStyle = '#6fbf63';
    for (const [x, y] of [[760, 400], [785, 350], [770, 270], [782, 215], [925, 410], [895, 300], [930, 280], [905, 225]]) {
      ctx.beginPath(); ctx.ellipse(x, y, 8, 4.5, .7, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = INK; ctx.lineWidth = 1.8;
    for (const [x, y] of roses) {
      ctx.fillStyle = '#ef7d95';
      ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#c64f6c';
      ctx.beginPath(); ctx.arc(x, y, 4, .5, 5.5); ctx.stroke();
      ctx.strokeStyle = INK;
    }

    // flower pot on the wall
    const px = 862;
    ctx.fillStyle = '#4f9a4f';
    for (const [dx, dy] of [[-14, -40], [0, -50], [14, -42], [-6, -30], [8, -30]]) {
      ctx.beginPath(); ctx.ellipse(px + dx, WALL_TOP - 20 + dy * .5, 8, 5, dx * .05, 0, 7); ctx.fill();
    }
    for (const [dx, dy, col] of [[-14, -46, '#f4846c'], [2, -56, '#ef7d95'], [16, -46, '#f4846c'], [-4, -38, '#f6a243']]) {
      flower({ x: px + dx * .3, y: WALL_TOP - 22, h: -dy - 22, col, kind: 2, ph: dx, s: .9 }, clock);
    }
    ctx.fillStyle = '#e07b52'; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(px - 20, WALL_TOP - 30); ctx.lineTo(px + 20, WALL_TOP - 30);
    ctx.lineTo(px + 15, WALL_TOP); ctx.lineTo(px - 15, WALL_TOP); ctx.closePath();
    ctx.fill(); ctx.stroke();
    rrect(px - 23, WALL_TOP - 34, 46, 9, 3); ctx.fill(); ctx.stroke();

    // flowers growing at the foot of the lawn and wall
    for (const f of backFlowers) flower(f, clock);
    for (const f of wallFlowers) flower(f, clock);

    for (const b of butterflies) butterfly(b, clock);

    // height marker
    const mx = WALL_X - 30;
    ctx.strokeStyle = 'rgba(74,50,38,.45)';
    ctx.lineWidth = 2;
    ctx.setLineDash([3, 6]);
    ctx.beginPath(); ctx.moveTo(mx, WALL_TOP + 2); ctx.lineTo(mx, GROUND - 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(mx - 6, WALL_TOP + 2); ctx.lineTo(mx + 6, WALL_TOP + 2);
    ctx.moveTo(mx - 6, GROUND - 2); ctx.lineTo(mx + 6, GROUND - 2);
    ctx.stroke();
    ctx.save();
    ctx.translate(mx - 9, 400);
    ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = 'rgba(74,50,38,.75)';
    ctx.font = '19px "Patrick Hand", "Comic Sans MS", cursive';
    ctx.textAlign = 'center';
    ctx.fillText('1.4 m tall', 0, 0);
    ctx.restore();
  }

  // ---------- route and step labels ----------
  // [tag x, tag y, point x, point y]
  const TAGS = [
    [120, 500, 200, 452],
    [330, 500, 392, 452],
    [300, 250, 462, 300],
    [420, 112, 566, 170],
    [350, 352, 546, 236],
    [590, 70, 616, 138],
    [690, 232, 716, 176]
  ];
  function drawRoute() {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.setLineDash([2, 10]);
    ctx.beginPath();
    ctx.moveTo(-10, GROUND - 22);
    ctx.lineTo(392, GROUND - 22);
    ctx.quadraticCurveTo(470, 180, 548, 205);
    ctx.quadraticCurveTo(570, 150, 640, 140);
    ctx.lineTo(704, 140);
    ctx.stroke();
    ctx.restore();
  }
  function drawTags(active, clock) {
    ctx.font = '22px "Patrick Hand", "Comic Sans MS", cursive';
    ctx.textBaseline = 'middle';
    TAGS.forEach(([tx, ty, px, py], i) => {
      const on = i === active;
      const col = STEP_COLORS[i];
      const label = STEP_NAMES[i];
      const w = ctx.measureText(label).width + 46;
      const bob = on ? Math.sin(clock * 5) * 2 : 0;
      ctx.globalAlpha = on ? 1 : .78;
      // leader line
      ctx.strokeStyle = INK; ctx.lineWidth = 2;
      ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.moveTo(tx + w / 2, ty + bob); ctx.lineTo(px, py); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(px, py, 4.5, 0, 7); ctx.fill(); ctx.stroke();
      // pill
      ctx.save();
      ctx.translate(tx, ty + bob);
      if (on) { ctx.translate(w / 2, 0); ctx.scale(1.1, 1.1); ctx.translate(-w / 2, 0); }
      ctx.fillStyle = 'rgba(74,50,38,.18)';
      rrect(3, -15, w, 32, 16); ctx.fill();
      ctx.fillStyle = on ? col : '#ffffff';
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
      rrect(0, -18, w, 32, 16); ctx.fill(); ctx.stroke();
      ctx.fillStyle = on ? '#ffffff' : col;
      ctx.beginPath(); ctx.arc(16, -2, 11, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = on ? INK : '#ffffff';
      ctx.font = '600 14px Fredoka, "Trebuchet MS", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(i + 1), 16, -1);
      ctx.textAlign = 'left';
      ctx.font = '22px "Patrick Hand", "Comic Sans MS", cursive';
      ctx.fillStyle = on ? '#ffffff' : INK;
      if (on) { ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.strokeText(label, 34, -1); }
      ctx.fillText(label, 34, -1);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic';
  }
  function drawBanner(active) {
    const text = `Step ${active + 1} of 7 · ${STEP_NAMES[active]}`;
    ctx.font = '600 22px Fredoka, "Trebuchet MS", sans-serif';
    const w = ctx.measureText(text).width + 36;
    ctx.fillStyle = 'rgba(74,50,38,.2)';
    rrect(22, 22, w, 42, 21); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
    rrect(18, 18, w, 42, 21); ctx.fill(); ctx.stroke();
    ctx.fillStyle = STEP_COLORS[active];
    ctx.beginPath(); ctx.arc(36, 39, 7, 0, 7); ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = INK;
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 50, 40);
    ctx.textBaseline = 'alphabetic';
  }

  // ---------- the cat ----------
  function drawLeg(l, col) {
    ctx.beginPath();
    ctx.moveTo(l[0], l[1]); ctx.lineTo(l[2], l[3]); ctx.lineTo(l[4], l[5]);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 13; ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = 9; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(l[4] + 1.5, l[5], 6.5, 5, 0, 0, 7);
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.stroke();
  }

  function drawTail(p, L) {
    const d = th => [-Math.cos(th), -Math.sin(th)];
    const [x0, y0] = [-L + 5, -6];
    const d1 = d(p.ta), d2 = d(p.ta + p.tc);
    const c1 = [x0 + 24 * d1[0], y0 + 24 * d1[1]];
    const c2 = [c1[0] + 22 * d2[0], c1[1] + 22 * d2[1]];
    const e = [c2[0] + 12 * d2[0], c2[1] + 12 * d2[1]];
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], e[0], e[1]);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 12.5; ctx.stroke();
    ctx.strokeStyle = C.orange; ctx.lineWidth = 8.5; ctx.stroke();
    ctx.setLineDash([7, 9]);
    ctx.strokeStyle = C.black; ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawHead(p, blink) {
    ctx.save();
    ctx.rotate(p.hd);
    // ears
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = C.ink;
    ctx.fillStyle = C.black;
    ctx.beginPath(); ctx.moveTo(-13, -6); ctx.lineTo(-10, -28); ctx.lineTo(1, -14); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.orange;
    ctx.beginPath(); ctx.moveTo(-1, -15); ctx.lineTo(8, -30); ctx.lineTo(14, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.pink;
    ctx.beginPath(); ctx.moveTo(3, -15); ctx.lineTo(8, -25); ctx.lineTo(11, -11); ctx.closePath(); ctx.fill();

    // head + muzzle as one outlined shape
    const shape = () => {
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, 7);
      ctx.moveTo(22, 5); ctx.ellipse(13, 5, 9, 6.5, 0, 0, 7);
    };
    shape(); ctx.lineWidth = 4.4; ctx.stroke();
    shape(); ctx.fillStyle = C.fur; ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, 7); ctx.clip();
    ctx.fillStyle = C.orange;
    ctx.beginPath(); ctx.ellipse(-10, -7, 12, 13, -.3, 0, 7); ctx.fill();
    ctx.fillStyle = C.black;
    ctx.beginPath(); ctx.ellipse(6, -15, 10, 6, .2, 0, 7); ctx.fill();
    ctx.fillStyle = C.blush;
    ctx.beginPath(); ctx.ellipse(5, 6, 5, 3.2, 0, 0, 7); ctx.fill();
    ctx.restore();

    // eye
    if (blink) {
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(3, -2); ctx.quadraticCurveTo(7, 1.5, 11, -2); ctx.stroke();
    } else {
      ctx.fillStyle = C.eye;
      ctx.beginPath(); ctx.ellipse(7, -3, 4.4, 4, -.15, 0, 7); ctx.fill();
      ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = C.ink;
      ctx.beginPath(); ctx.ellipse(7.6, -3, 1.8, 3.3, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(9, -4.8, 1.3, 0, 7); ctx.fill();
    }
    // nose, mouth, whiskers
    ctx.fillStyle = C.pink;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(19, 1); ctx.lineTo(23, 1.5); ctx.lineTo(21, 4.5); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(21, 4.5); ctx.lineTo(20, 7.5); ctx.quadraticCurveTo(17, 9.5, 15, 8); ctx.stroke();
    ctx.strokeStyle = 'rgba(74,50,38,.55)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(17, 5); ctx.lineTo(35, 1);
    ctx.moveTo(17, 6); ctx.lineTo(36, 7);
    ctx.stroke();
    ctx.restore();
  }

  function drawCat(p, blink) {
    const g = geom(p), L = g.L;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    drawTail(p, L);
    drawLeg(g.fF, C.shade);
    drawLeg(g.bF, C.shade);
    drawLeg(g.bN, C.fur);
    drawLeg(g.fN, C.fur);

    // body + chest as one outlined shape
    const body = () => {
      ctx.beginPath(); ctx.ellipse(0, 0, L, 19, 0, 0, 7);
      ctx.moveTo(L * .72 + 15, -6); ctx.ellipse(L * .72, -6, 15, 15, 0, 0, 7);
    };
    ctx.strokeStyle = C.ink;
    body(); ctx.lineWidth = 4.4; ctx.stroke();
    body(); ctx.fillStyle = C.fur; ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 0, L, 19, 0, 0, 7); ctx.clip();
    ctx.fillStyle = C.orange;
    ctx.beginPath(); ctx.ellipse(-L * .45, -9, 22, 15, .1, 0, 7); ctx.fill();
    ctx.fillStyle = C.black;
    ctx.beginPath(); ctx.ellipse(L * .2, -16, 19, 10, -.1, 0, 7); ctx.fill();
    ctx.fillStyle = C.orange;
    ctx.beginPath(); ctx.ellipse(-L * .02, -18, 8, 6, 0, 0, 7); ctx.fill();
    ctx.restore();

    // haunch
    ctx.beginPath(); ctx.ellipse(-L * .56, 3, 16, 14, -.2, 0, 7);
    ctx.fillStyle = C.fur; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = C.black;
    ctx.beginPath(); ctx.ellipse(-L * .56 - 6, -8, 15, 9, -.3, 0, 7); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(-L * .56, 3, 16, 14, -.2, Math.PI * 1.05, Math.PI * 2.2); ctx.stroke();

    ctx.translate(L * .82, -16);
    drawHead(p, blink);
    ctx.restore();
  }

  function drawShadow(p) {
    const onWall = p.x > WALL_X - 6;
    if (!onWall && p.x > WALL_X - 40) return;
    const surface = onWall ? WALL_TOP : GROUND;
    const gap = surface - (p.y + 45);
    if (gap < -30) return;
    const a = clamp(.25 - Math.max(0, gap) / 600, 0, .25);
    const s = clamp(1 - Math.max(0, gap) / 400, .4, 1);
    ctx.fillStyle = `rgba(74,50,38,${a})`;
    ctx.beginPath(); ctx.ellipse(p.x, surface + 2, 50 * s, 6 * s, 0, 0, 7); ctx.fill();
  }

  // ---------- dust, crumbs and petals ----------
  const bits = [];
  function puff(x, y, n, cols, spread, up) {
    for (let i = 0; i < n; i++) {
      bits.push({ x, y, vx: (Math.random() - .5) * spread, vy: -Math.random() * up, life: 0, max: .7 + Math.random() * .6, r: 2 + Math.random() * 2.5, col: cols[i % cols.length] });
    }
  }
  function updateBits(dt) {
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.life += dt;
      if (b.life > b.max) { bits.splice(i, 1); continue; }
      b.vy += 300 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y > GROUND) { b.y = GROUND; b.vy *= -.2; b.vx *= .6; }
    }
  }
  function drawBits() {
    for (const b of bits) {
      ctx.globalAlpha = 1 - b.life / b.max;
      ctx.fillStyle = b.col;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- playback ----------
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = reduce ? 9 : 0;
  let playing = !reduce;
  let speed = 1;
  let last = null;
  let crumbTick = 0;

  const playBtn = document.getElementById('play');
  const slowBtn = document.getElementById('slow');
  const stepEls = [...document.querySelectorAll('#steps li')];
  function syncPlay() { playBtn.textContent = playing ? 'Pause' : 'Play'; }
  syncPlay();

  playBtn.addEventListener('click', () => { playing = !playing; syncPlay(); });
  document.getElementById('replay').addEventListener('click', () => { t = 0; bits.length = 0; playing = true; syncPlay(); });
  slowBtn.addEventListener('click', () => {
    const on = slowBtn.getAttribute('aria-pressed') !== 'true';
    slowBtn.setAttribute('aria-pressed', String(on));
    speed = on ? .3 : 1;
  });
  document.getElementById('steps').addEventListener('click', e => {
    const b = e.target.closest('button[data-step]');
    if (!b) return;
    t = STEP_STARTS[+b.dataset.step] + .001;
    bits.length = 0;
    playing = true; syncPlay();
  });

  let shownStep = -1;
  function frame(now) {
    if (last === null) last = now;
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    const prev = t;
    if (playing) {
      t += dt * speed;
      if (t >= T.end) { t = 0; bits.length = 0; }
      // a puff of petals and dust on take-off, brick crumbs while scrambling
      if (prev < T.crouch && t >= T.crouch) puff(X_CROUCH - 20, GROUND, 20, ['#e8d3a8', '#ef7d95', '#f2c53d', '#ffffff'], 170, 140);
      if (t > T.grab && t < T.scramble) {
        crumbTick += dt * speed;
        if (crumbTick > .09) {
          crumbTick = 0;
          const p = poseAt(t), g = geom(p);
          const w = toWorld(p, g.bN[4], g.bN[5]);
          puff(Math.min(w[0], WALL_X - 2), w[1], 2, ['#e88d6c'], 60, 30);
        }
      }
      updateBits(dt * speed);
    }

    const p = poseAt(t);
    const clock = now / 1000;
    const blink = t > T.crouch && t < T.pull ? false : (clock % 3.4) < .14;
    const s = stepAt(t);

    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    drawScene(clock);
    drawRoute();
    drawShadow(p);
    drawCat(p, blink);
    drawBits();
    for (const f of frontFlowers) flower(f, clock, 1.15);
    drawTags(s, clock);
    drawBanner(s);
    ctx.fillStyle = grainPattern;
    ctx.fillRect(0, 0, W, H);

    if (s !== shownStep) {
      stepEls.forEach((el, i) => el.classList.toggle('on', i === s));
      shownStep = s;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
